name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # DB 시험은 진짜 Postgres에서 돈다(2단계 research R19). 개발 DB와 같은 이미지·값이다
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kingo
          POSTGRES_PASSWORD: kingo
          POSTGRES_DB: kingo
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U kingo -d kingo" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://kingo:kingo@127.0.0.1:54329/kingo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
