name: Claude Code Review

# PR 마다 Claude Code 의 code-review 플러그인으로 정확성·보안 리뷰를 돌리고 PR 에 인라인 댓글로 남긴다.
# 필요한 것: Claude GitHub App 설치(https://github.com/apps/claude) + 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN(`claude setup-token`).
# 공개 저장소라 포크에서 온 PR 에는 시크릿이 안 넘어가 돌지 않는다. 같은 저장소 브랜치의 PR 만 리뷰한다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # 인라인 댓글 MCP 서버는 --allowedTools 에 이름이 있어야 켜진다. 지우지 않는다.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
